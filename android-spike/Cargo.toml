[package]
name = "dangomushi-android-storage-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dangomushi = { path = ".." }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
jni = "=0.22.4"
winit = { version = "=0.30.13", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "com.e20c1.dangomushi.storagespike"
build_targets = ["aarch64-linux-android"]
label = "DANGOMUSHI Storage Spike"

[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
label = "DANGOMUSHI Storage Spike"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
label = "DANGOMUSHI Storage Spike"
exported = true
orientation = "unspecified"
