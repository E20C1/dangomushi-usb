name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Core tests
        run: cargo test --locked

      - name: Core release build
        run: cargo build --locked --release --bin dangomushi

      - name: Desktop library tests
        run: cargo test --locked --features desktop --lib

      - name: Native desktop release build
        run: cargo build --locked --release --features desktop --bin dangomushi-desktop

      - name: Verify recovered smoke entrypoints
        run: python scripts/verify-smoke-entrypoints.py

      - name: Build portable release bundle
        run: python scripts/build-release-bundle.py

      - name: Verify portable release bundle
        run: python scripts/verify-release-bundle.py --directory dist

      - name: Upload Windows portable bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false

      - name: Upload Unix portable bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false

      - name: Upload portable bundle checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.sha256
          archive: false

  offline-vendor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Generate locked vendor snapshot
        run: sh scripts/vendor-dependencies.sh

      - name: Frozen offline build/test verification
        run: sh scripts/verify-vendored-dependencies.sh


  frozen-reconstruction:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Generate locked vendor snapshot
        run: sh scripts/vendor-dependencies.sh

      - name: Exercise complete verified offline reconstruction
        run: cargo --config .cargo/vendor-config.toml test --frozen --test frozen_staged_rebuild_contract real_frozen_rebuild_from_verified_staging -- --ignored --exact --nocapture


  android-storage-spike:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android

      - name: Host-side storage contract regression
        run: cargo test --manifest-path android-spike/Cargo.toml

      - name: Install cargo-apk for A0 packaging
        run: cargo install cargo-apk --version 0.10.0 --locked

      - name: Select installed Android NDK
        shell: bash
        run: |
          NDK_DIR="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build ARM64 Android storage-contract APK
        working-directory: android-spike
        run: cargo apk build

      - name: Upload Android storage-contract APK
        uses: actions/upload-artifact@v7
        with:
          name: android-storage-spike
          path: android-spike/target/debug/apk/dangomushi-android-storage-spike.apk
          archive: false
